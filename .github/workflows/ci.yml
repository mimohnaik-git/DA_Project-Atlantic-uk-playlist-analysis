name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q app.py src scripts tests
      - run: pytest -q --tb=short
      - run: python scripts/validate.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docgen/package-lock.json
      - run: npm ci
        working-directory: docgen
      - run: npm test
        working-directory: docgen
      - run: python scripts/verify_methodology.py
      - run: python scripts/build_all.py
      - name: Verify deterministic generated artifacts are current
        run: |
          git diff --exit-code -- \
            outputs/report_data.json \
            outputs/data_quality_report.json \
            outputs/data_quality_report.csv \
            outputs/analytics_output.txt \
            outputs/artist_appearance_counts.csv \
            outputs/build_manifest.json
