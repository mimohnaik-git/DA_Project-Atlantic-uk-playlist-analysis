name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py src scripts tests
      - run: pytest -q --tb=short
      - run: python scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docgen/package-lock.json
      - run: npm ci
        working-directory: docgen
      - run: npm test
        working-directory: docgen
      - run: python scripts/verify_methodology.py
      - run: python scripts/build_all.py
